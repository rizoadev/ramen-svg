    <circle cx="614" cy="510" r="27" fill="#6ED67E"/><circle cx="614" cy="510" r="11" fill="#C9F79B"/>
    <circle cx="568" cy="552" r="29" fill="#6ED67E"/><circle cx="568" cy="552" r="12" fill="#C9F79B"/>
    <circle cx="628" cy="558" r="29" fill="#6ED67E"/><circle cx="628" cy="558" r="12" fill="#C9F79B"/>
    <circle cx="672" cy="602" r="24" fill="#6ED67E"/><circle cx="672" cy="602" r="10" fill="#C9F79B"/>
    <circle cx="612" cy="632" r="23" fill="#6ED67E"/><circle cx="612" cy="632" r="10" fill="#C9F79B"/>
