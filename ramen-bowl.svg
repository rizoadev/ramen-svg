<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-label="Bowl of ramen viewed from above">
  <title>Bowl of ramen</title>
  <defs>
    <linearGradient id="bowlGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A90E2"/>
      <stop offset="0.45" stop-color="#2F74D6"/>
      <stop offset="1" stop-color="#1D5BBF"/>
    </linearGradient>
    <linearGradient id="brothGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6CFA0"/>
      <stop offset="0.35" stop-color="#F0AD62"/>
      <stop offset="0.75" stop-color="#D97F36"/>
      <stop offset="1" stop-color="#C4631F"/>
    </linearGradient>
    <radialGradient id="yolkGrad" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#FFE95E"/>
      <stop offset="0.55" stop-color="#FFC72E"/>
      <stop offset="1" stop-color="#FF9E0A"/>
    </radialGradient>
    <linearGradient id="eggGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDEFF2"/>
    </linearGradient>
  </defs>

  <!-- Bowl -->
