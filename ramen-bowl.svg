    <path d="M 455 805 C 540 782 500 852 590 842 C 670 834 620 785 702 795"/>
    <path d="M 600 700 C 670 680 640 745 715 735"/>
  </g>
  <g fill="none" stroke="#FFF8A8" stroke-width="6" stroke-linecap="round" opacity="0.95">
    <path d="M 450 232 Q 515 210 580 232"/>
    <path d="M 750 400 C 800 425 730 465 785 498"/>
    <path d="M 200 660 C 240 685 180 715 235 745"/>
