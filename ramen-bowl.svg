  <!-- Broth -->
  <circle cx="500" cy="505" r="378" fill="url(#brothGrad)" stroke="#16233A" stroke-width="8"/>
  <!-- Broth light patch, upper-left -->
  <path d="M 210 300 A 378 378 0 0 1 640 150 L 760 270 L 500 520 L 260 430 Z" fill="#FFFFFF" opacity="0.16"/>
  <path d="M 260 620 Q 340 560 300 640 Q 350 700 290 760" fill="none" stroke="#F8D4A8" stroke-width="10" stroke-linecap="round" opacity="0.6"/>

