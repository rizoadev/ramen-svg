<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-label="Japanese ramen poster">
  <title>Japanese Ramen</title>
  <defs>
    <pattern id="seigaiha" width="120" height="120" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#E9D6BD" stroke-width="3">
        <path d="M -60 60 A 60 60 0 0 1 60 60"/>
        <path d="M -40 60 A 40 40 0 0 1 40 60"/>
        <path d="M -20 60 A 20 20 0 0 1 20 60"/>
        <path d="M 60 60 A 60 60 0 0 1 180 60"/>
        <path d="M 80 60 A 40 40 0 0 1 160 60"/>
        <path d="M 100 60 A 20 20 0 0 1 140 60"/>
        <path d="M 0 120 A 60 60 0 0 1 120 120"/>
        <path d="M 20 120 A 40 40 0 0 1 100 120"/>
        <path d="M 40 120 A 20 20 0 0 1 80 120"/>
        <path d="M -60 180 A 60 60 0 0 1 60 180"/>
        <path d="M -40 180 A 40 40 0 0 1 40 180"/>
        <path d="M -20 180 A 20 20 0 0 1 20 180"/>
        <path d="M 60 180 A 60 60 0 0 1 180 180"/>
        <path d="M 80 180 A 40 40 0 0 1 160 180"/>
        <path d="M 100 180 A 20 20 0 0 1 140 180"/>
      </g>
    </pattern>
    <clipPath id="bowlClip">
      <ellipse cx="500" cy="545" rx="348" ry="135"/>
    </clipPath>
    <radialGradient id="yolk2" cx="0.4" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#FFE066"/>
      <stop offset="0.6" stop-color="#FFC21A"/>
      <stop offset="1" stop-color="#FF9E00"/>
    </radialGradient>
  </defs>

  <!-- Background: cream seigaiha waves -->
  <rect width="1000" height="1000" fill="#F6EAD8"/>
  <rect width="1000" height="1000" fill="url(#seigaiha)"/>

  <!-- Title -->
  <text x="500" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="10" fill="#E8501E">— JAPANESE —</text>
  <text x="500" y="288" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="188" font-weight="900" letter-spacing="4" fill="#E8501E">RAMEN</text>

  <!-- Bowl body -->
  <path d="M 132 545 C 132 780 308 908 500 908 C 692 908 868 780 868 545 C 868 452 694 402 500 402 C 306 402 132 452 132 545 Z" fill="#233047" stroke="#101828" stroke-width="8"/>
  <path d="M 165 620 C 240 800 360 875 500 875 C 640 875 760 800 835 620" fill="none" stroke="#3A4A68" stroke-width="18" stroke-linecap="round" opacity="0.6"/>

  <!-- Bowl interior, clipped contents -->
  <ellipse cx="500" cy="545" rx="355" ry="142" fill="#101828"/>
  <g clip-path="url(#bowlClip)">
    <!-- Noodles -->
    <g fill="none" stroke="#DDB57E" stroke-width="15" stroke-linecap="round">
      <path d="M 150 470 Q 240 448 330 470 T 510 470 T 690 470 T 860 470"/>
      <path d="M 150 505 Q 240 485 330 505 T 510 505 T 690 505 T 860 505"/>
      <path d="M 150 540 Q 240 518 330 540 T 510 540 T 690 540 T 860 540"/>
      <path d="M 150 575 Q 240 555 330 575 T 510 575 T 690 575 T 860 575"/>
      <path d="M 150 610 Q 240 590 330 610 T 510 610 T 690 610 T 860 610"/>
      <path d="M 150 645 Q 240 625 330 645 T 510 645 T 690 645 T 860 645"/>
      <path d="M 200 675 Q 290 655 380 675 T 560 675 T 740 675"/>
    </g>
    <g fill="none" stroke="#B98D54" stroke-width="4" stroke-linecap="round" opacity="0.8">
      <path d="M 170 490 Q 260 472 350 490 T 530 490"/>
      <path d="M 170 560 Q 260 542 350 560 T 530 560"/>
      <path d="M 500 600 Q 590 582 680 600 T 850 600"/>
    </g>

    <!-- Chashu pork, right side -->
    <g transform="rotate(-28 715 565)">
      <rect x="622" y="508" width="188" height="116" rx="54" fill="#F7B08E" stroke="#101828" stroke-width="7"/>
      <rect x="642" y="528" width="148" height="76" rx="36" fill="#FBC9A8"/>
      <path d="M 660 560 Q 710 550 760 562" fill="none" stroke="#FFD9C0" stroke-width="7" stroke-linecap="round"/>
      <path d="M 665 585 Q 715 575 755 587" fill="none" stroke="#E89A72" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g transform="rotate(-28 675 645)">
      <rect x="582" y="588" width="188" height="116" rx="54" fill="#F7B08E" stroke="#101828" stroke-width="7"/>
      <rect x="602" y="608" width="148" height="76" rx="36" fill="#FBC9A8"/>
      <path d="M 620 640 Q 670 630 720 642" fill="none" stroke="#FFD9C0" stroke-width="7" stroke-linecap="round"/>
      <path d="M 625 665 Q 675 655 715 667" fill="none" stroke="#E89A72" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- Egg, upper middle -->
    <g transform="rotate(6 518 468)">
      <ellipse cx="518" cy="468" rx="118" ry="86" fill="#FFF8EE" stroke="#101828" stroke-width="7"/>
      <ellipse cx="518" cy="478" rx="64" ry="55" fill="url(#yolk2)" stroke="#101828" stroke-width="5"/>
      <ellipse cx="495" cy="458" rx="18" ry="12" fill="#FFFFFF" opacity="0.85"/>
    </g>
    <!-- Egg, left -->
    <g transform="rotate(-14 328 552)">
      <ellipse cx="328" cy="552" rx="118" ry="86" fill="#FFF8EE" stroke="#101828" stroke-width="7"/>
      <ellipse cx="328" cy="562" rx="64" ry="55" fill="url(#yolk2)" stroke="#101828" stroke-width="5"/>
      <ellipse cx="305" cy="542" rx="18" ry="12" fill="#FFFFFF" opacity="0.85"/>
    </g>

    <!-- Green onions, lower left -->
    <g stroke="#101828" stroke-width="4">
      <circle cx="238" cy="612" r="22" fill="#5DBB6A"/><circle cx="238" cy="612" r="9" fill="#B7E48A"/>
      <circle cx="282" cy="600" r="22" fill="#5DBB6A"/><circle cx="282" cy="600" r="9" fill="#B7E48A"/>
      <circle cx="262" cy="642" r="24" fill="#5DBB6A"/><circle cx="262" cy="642" r="10" fill="#B7E48A"/>
      <circle cx="306" cy="636" r="20" fill="#5DBB6A"/><circle cx="306" cy="636" r="8" fill="#B7E48A"/>
      <circle cx="342" cy="616" r="20" fill="#5DBB6A"/><circle cx="342" cy="616" r="8" fill="#B7E48A"/>
      <circle cx="326" cy="664" r="20" fill="#5DBB6A"/><circle cx="326" cy="664" r="8" fill="#B7E48A"/>
      <circle cx="380" cy="640" r="18" fill="#5DBB6A"/><circle cx="380" cy="640" r="7" fill="#B7E48A"/>
      <circle cx="216" cy="648" r="18" fill="#5DBB6A"/><circle cx="216" cy="648" r="7" fill="#B7E48A"/>
    </g>
  </g>

  <!-- Orange rim -->
  <ellipse cx="500" cy="545" rx="355" ry="142" fill="none" stroke="#E87A2E" stroke-width="11"/>
  <ellipse cx="500" cy="545" rx="348" ry="135" fill="none" stroke="#101828" stroke-width="4" opacity="0.6"/>

  <!-- Chopsticks, diagonal from upper right -->
  <polygon points="792,188 852,218 472,652 428,622" fill="#C96A2E" stroke="#101828" stroke-width="7" stroke-linejoin="round"/>
  <polygon points="842,268 902,298 482,682 442,652" fill="#D97A35" stroke="#101828" stroke-width="7" stroke-linejoin="round"/>
  <path d="M 812 208 L 462 632" fill="none" stroke="#F0A05A" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M 862 288 L 472 662" fill="none" stroke="#F5AC68" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
</svg>
